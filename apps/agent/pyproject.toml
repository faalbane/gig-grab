[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gig-grab-agent"
version = "0.0.0"
description = "Gig-grab voice agent — Pipecat pipeline for candidate and employer phone interviews"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai>=0.0.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "deepgram-sdk>=3.7",
    "groq>=0.13",
    "anthropic>=0.39",
    "cartesia>=1.0",
    "twilio>=9.0",
    "redis>=5.0",
    "google-cloud-firestore>=2.18",
    "prometheus-client>=0.21",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
