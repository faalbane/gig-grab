[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gig-grab-agent"
version = "0.0.0"
description = "Gig-grab voice agent — Pipecat pipeline for candidate and employer phone interviews"
requires-python = ">=3.11"
dependencies = [
    # Pin to cozmo's proven 0.x line. 1.x reorganised module paths
    # heavily; the extras here exist in 0.x as soft deps when available.
    "pipecat-ai>=0.0.70,<1.0",
    "loguru>=0.7",
    "websockets>=13",
    "soundfile>=0.12",
    "numpy>=1.26",
    "openai>=1.50",
    "noisereduce>=3.0",
    "av>=12.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "silero-vad>=5.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "deepgram-sdk>=3.7",
    "groq>=0.13",
    "anthropic>=0.39",
    "cartesia>=1.0",
    "twilio>=9.0",
    "asyncpg>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
